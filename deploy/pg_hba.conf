# PostgreSQL Client Authentication Configuration for cluster 16/semente.
# The database is loopback-only; no project other than Semente receives a role.

local   all           postgres                                  peer
local   all           all                                       reject

host    semente_prod  semente_runtime   127.0.0.1/32            scram-sha-256
host    semente_prod  semente_migrator  127.0.0.1/32            scram-sha-256

host    all           all               0.0.0.0/0               reject
host    all           all               ::0/0                    reject
